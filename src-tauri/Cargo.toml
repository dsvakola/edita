[package]
name = "edita"
version = "1.3.0"
description = "Edita - a simple text/code editor for students, teachers and developers"
authors = ["Prof. Dattaraj S. Vidyasagar", "Prof. Yash D. Vidyasagar", "Vidyasagar Robotics Academy <softinquiry@vsa.edu.in>"]
license = "GPL-3.0-only"
homepage = "https://vsa.edu.in/software/"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# Small, fast release build.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
